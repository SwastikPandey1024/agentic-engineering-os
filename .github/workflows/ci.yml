name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-matrix:
    name: Fast Verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AgenticOS Package
        run: python -m pip install .

      - name: Verify Console Entrypoint
        run: |
          agentic-os --version
          agentic-os --help

      - name: Run CLI & IDE Integration Test Suite
        run: python ./tests/test_cli.py

      - name: Validate All Skills Frontmatter & Standards
        run: python ./tests/validate_skills.py

      - name: Run Zero-Secret Scanner
        run: python ./tests/scan_secrets.py

      - name: Validate Starter Templates
        run: python ./tests/test_templates.py

      - name: Test Environment Guard Hook Engine
        run: python ./tests/test_hooks.py

      - name: Validate Documentation References
        run: python ./tests/test_documentation.py

      - name: Generate CI Quality Gate Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python ./tests/generate_ci_summary.py
