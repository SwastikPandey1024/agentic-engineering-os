name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build Distribution Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build toolchain
        run: python -m pip install --upgrade pip build

      - name: Build source distribution and binary wheel
        run: python -m build

      - name: Verify distribution artifacts & tag version alignment
        run: python ./tests/verify_release_artifacts.py

      - name: Upload distribution packages
        uses: actions/upload-artifact@v5
        with:
          name: dist-packages
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentic-engineering-os
    permissions:
      id-token: write
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v6
        with:
          name: dist-packages
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Record PyPI Publication Summary
        if: always()
        run: |
          python -c '
          import os
          summary_path = os.getenv("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as sf:
                  sf.write("### 🚀 PyPI Trusted Publication Summary\n\n")
                  sf.write("| Property | Value |\n")
                  sf.write("| :--- | :--- |\n")
                  sf.write("| **Target Index** | [PyPI](https://pypi.org/p/agentic-engineering-os) |\n")
                  sf.write("| **Environment** | `pypi` |\n")
                  sf.write("| **Auth Mechanism** | PyPI Trusted Publishing (OIDC ID Token) |\n")
                  sf.write("| **Stage** | Production Release |\n")
                  sf.write("| **Status** | ✅ Published successfully |\n")
          '
