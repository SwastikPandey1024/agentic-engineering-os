[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-ml-template"
version = "0.1.0"
description = "Machine Learning Project Template"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "jupyterlab>=4.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
